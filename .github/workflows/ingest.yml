name: UK Council VoteWatch Ingestion

on:
  schedule:
    - cron: "0 2 * * *" # Runs nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (use 2019 for full historical backfill, 2026 for nightly)"
        required: true
        default: "2026"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Modern.Gov Sync & Division Crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          START_YR="${{ github.event.inputs.start_year || '2026' }}"
          python moderngov_worker.py full-sync --authority E06000033 --start-year "$START_YR" --end-year 2026
